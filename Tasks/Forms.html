<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>HTML Form Example</h1>
    <form action="">
        <label for="n">Name:</label>
        <input type="text" name="" id="n">
        <br><br>
        <label for="p">Password:</label>
        <input type="password" id="p">
        <br><br>
        <label for="e">Email:</label>
        <input type="email" id="e">
        <br><br>
        <label for="c">Contact:</label>
        <input type="tel" id="c">
        <br><br>
        Gender:<input type="radio" name="gender" id="m"><label for="m">Male</label>
               <input type="radio" name="gender" id="f"><label for="f">Female</label>
        <br><br>
        Hobbies:
        <input type="checkbox" name="reading" id="r"><label for="r"> Reading</label>
        <input type="checkbox" name="sports" id="s"><label for="s"> Sports</label>
        <input type="checkbox" name="music" id="m"><label for="m"> Music</label>
        <br><br>
        <label for="a">Address</label>
        <br>
        <textarea name="feedback" id="a" cols="30" rows="4"></textarea>
        <br><br>
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">  
    </form>
</body>
</html>
